<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأقسام | شباب ستايل</title>

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>

<body class="dashboard-body">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="dashboard-sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">
                <i class="fa-solid fa-shirt"></i>
                <span>شباب <span class="text-gradient">ستايل</span></span>
            </a>
            <button class="sidebar-close" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="admin-info">
            <div class="admin-avatar"><i class="fa-solid fa-user-tie"></i></div>
            <div class="admin-details">
                <h6>المدير العام</h6><span>admin@shababstyle.com</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <span class="nav-section-title">القائمة الرئيسية</span>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>لوحة التحكم</span></a>
            <a href="products.html" class="nav-item"><i class="fa-solid fa-box"></i><span>المنتجات</span></a>
            <a href="orders.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>الطلبات</span></a>
            <a href="customers.html" class="nav-item"><i class="fa-solid fa-users"></i><span>العملاء</span></a>
            <a href="categories.html" class="nav-item active"><i
                    class="fa-solid fa-layer-group"></i><span>الأقسام</span></a>
            <a href="coupons.html" class="nav-item"><i class="fa-solid fa-ticket"></i><span>الكوبونات</span></a>
            <span class="nav-section-title">التقارير</span>
            <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>التقارير</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
            <span class="nav-section-title">أخرى</span>
            <a href="../index.html" class="nav-item" target="_blank"><i class="fa-solid fa-globe"></i><span>عرض
                    الموقع</span></a>
            <a href="#" class="nav-item logout-btn" id="logoutBtn"><i
                    class="fa-solid fa-right-from-bracket"></i><span>تسجيل الخروج</span></a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">إدارة الأقسام</h1>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <div class="dashboard-content">

            <div class="page-actions-bar" data-aos="fade-up">
                <div class="page-actions-left">
                    <h3>كل الأقسام (<span id="categoriesCount">0</span>)</h3>
                    <p>إدارة أقسام المتجر</p>
                </div>
                <button class="btn btn-primary" id="addCategoryBtn">
                    <i class="fa-solid fa-plus"></i> إضافة قسم جديد
                </button>
            </div>

            <!-- Categories Grid -->
            <div class="row g-4" id="categoriesGrid" data-aos="fade-up">
                <!-- سيتم إضافتها بالجافاسكريبت -->
            </div>

        </div>
    </main>


    <!-- Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content dashboard-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">إضافة قسم جديد</h5>
                    <button type="button" class="btn-close-modal-sm" data-bs-dismiss="modal"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId">
                        <div class="mb-3">
                            <label class="form-label">اسم القسم *</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الرابط المختصر (slug)</label>
                            <input type="text" class="form-control" id="categorySlug" placeholder="مثال: youth">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">رابط الصورة</label>
                            <input type="url" class="form-control" id="categoryImage" placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">أيقونة (Font Awesome)</label>
                            <input type="text" class="form-control" id="categoryIcon" placeholder="fa-shirt">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea class="form-control" id="categoryDesc" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button class="btn btn-primary" id="saveCategoryBtn"><i class="fa-solid fa-save"></i> حفظ</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Delete Modal -->
    <div class="modal fade" id="deleteCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content dashboard-modal text-center">
                <div class="modal-body p-4">
                    <div class="delete-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h5>تأكيد الحذف</h5>
                    <p class="text-muted">هل أنت متأكد من حذف "<span id="deleteCategoryName"></span>"؟</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
                        <button class="btn btn-danger" id="confirmDeleteCategoryBtn"><i class="fa-solid fa-trash"></i>
                            حذف</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="toast-container position-fixed bottom-0 start-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/main.js"></script>

    <script src="../assets/js/categories.js"></script>
</body>

</html>
