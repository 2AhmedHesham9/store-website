<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | شباب ستايل</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-body">

    <div id="loader" class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">

        <!-- Left: Image -->
        <div class="auth-image">
            <div class="auth-image-overlay">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-shirt"></i>
                    <span>شباب <span class="text-gradient">ستايل</span></span>
                </a>
                <div class="auth-image-content">
                    <h2>أهلاً بيك تاني!</h2>
                    <p>سجل دخولك واستمتع بأحدث الموديلات والعروض الحصرية</p>
                </div>
                <div class="auth-image-footer">
                    <p>© 2026شباب ستايل</p>
                </div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">

                <div class="auth-form-header">
                    <h1>تسجيل الدخول</h1>
                    <p>مرحباً بعودتك! يرجى إدخال بياناتك</p>
                </div>

                <form id="loginForm" class="auth-form">

                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" class="form-control" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" class="form-control" placeholder="••••••••" id="passwordInput"
                                required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="checkbox-label">
                            <input type="checkbox">
                            <span>تذكرني</span>
                        </label>
                        <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fa-solid fa-sign-in-alt"></i> دخول
                    </button>

                    <div class="auth-divider">
                        <span>أو</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn google">
                            <i class="fa-brands fa-google"></i> Google
                        </button>
                        <button type="button" class="social-btn facebook">
                            <i class="fa-brands fa-facebook-f"></i> Facebook
                        </button>
                    </div>

                    <p class="auth-switch">
                        ليس لديك حساب؟
                        <a href="register.html">إنشاء حساب جديد</a>
                    </p>

                </form>

            </div>
        </div>
    </div>


    <div class="toast-container position-fixed bottom-0 start-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
