<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | شباب ستايل</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-body">

    <div id="loader" class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <div class="auth-container">

        <!-- Left: Image -->
        <div class="auth-image register-image">
            <div class="auth-image-overlay">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-shirt"></i>
                    <span>شباب <span class="text-gradient">ستايل</span></span>
                </a>
                <div class="auth-image-content">
                    <h2>انضم لينا!</h2>
                    <p>أنشئ حسابك واستمتع بخصم 10% على أول طلب</p>
                </div>
                <div class="auth-image-footer">
                    <p>© 2026شباب ستايل</p>
                </div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">

                <div class="auth-form-header">
                    <h1>إنشاء حساب جديد</h1>
                    <p>أدخل بياناتك للبدء في التسوق</p>
                </div>

                <form id="registerForm" class="auth-form">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">الاسم الأول</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-user"></i>
                                    <input type="text" class="form-control" placeholder="أحمد" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">اسم العائلة</label>
                                <div class="input-with-icon">
                                    <i class="fa-solid fa-user"></i>
                                    <input type="text" class="form-control" placeholder="محمد" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" class="form-control" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">رقم الموبايل</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" class="form-control" placeholder="01097957329" pattern="[0-9]{11}"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" class="form-control" placeholder="••••••••" id="passwordInput"
                                required minlength="6">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <small class="text-muted">6 أحرف على الأقل</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">تأكيد كلمة المرور</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" class="form-control" placeholder="••••••••" id="confirmPassword"
                                required>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agreeTerms" required>
                            <span>أوافق على <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fa-solid fa-user-plus"></i> إنشاء الحساب
                    </button>

                    <p class="auth-switch">
                        لديك حساب بالفعل؟
                        <a href="login.html">تسجيل الدخول</a>
                    </p>

                </form>

            </div>
        </div>
    </div>


    <div class="toast-container position-fixed bottom-0 start-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
